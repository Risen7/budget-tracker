<!-- Declare an HTML5 document and the language used by its visible content. -->
<!doctype html>
<html lang="en">
  <head>
    <!-- Set the document character encoding so text and symbols render correctly. -->
    <meta charset="UTF-8" />
    <!-- Point browsers to the public SVG favicon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Make the layout use the device width on phones and tablets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set the browser-tab title. -->
    <title>budget-tracker</title>
  </head>
  <body>
    <!-- Provide the DOM node where React mounts the dashboard. -->
    <div id="root"></div>
    <!-- Load the TypeScript entry point as a JavaScript module. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
